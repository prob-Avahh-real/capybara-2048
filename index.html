<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capybara 2048</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌿 Capybara 2048 🌿</h1>
            <div class="score-container">
                <div class="score-box">
                    <span class="score-label">Score</span>
                    <span class="score-value" id="score">0</span>
                </div>
                <div class="score-box">
                    <span class="score-label">Best</span>
                    <span class="score-value" id="best-score">0</span>
                </div>
            </div>
        </header>
        
        <div class="controls">
            <button class="new-game-btn" id="new-game-btn">New Game</button>
        </div>
        
        <div class="game-container">
            <div class="grid-container" id="grid-container">
                <!-- Grid cells will be generated by JS -->
            </div>
            <div class="tile-container" id="tile-container">
                <!-- Tiles will be generated by JS -->
            </div>
        </div>
        
        <div class="instructions">
            <p>Use <strong>Arrow Keys</strong> or <strong>Swipe</strong> to move tiles</p>
            <p>Combine matching Capybaras to reach 2048!</p>
        </div>
        
        <div class="game-over" id="game-over">
            <div class="game-over-content">
                <h2>Game Over!</h2>
                <p>Your score: <span id="final-score">0</span></p>
                <button class="new-game-btn" id="retry-btn">Try Again</button>
            </div>
        </div>
        
        <div class="win-screen" id="win-screen">
            <div class="win-content">
                <h2>🎉 You Win! 🎉</h2>
                <p>You reached 2048!</p>
                <button class="new-game-btn" id="continue-btn">Continue Playing</button>
                <button class="new-game-btn" id="new-game-win-btn">New Game</button>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
